<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Studio Logo Preview</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f7f4ef;
        color: #211f1a;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(980px, calc(100vw - 48px));
        display: grid;
        gap: 28px;
      }

      .surface {
        border: 1px solid rgba(33, 31, 26, 0.1);
        background: rgba(255, 255, 255, 0.72);
        border-radius: 8px;
        padding: 32px;
      }

      .lockup {
        width: min(760px, 100%);
        height: auto;
      }

      .marks {
        display: flex;
        align-items: center;
        gap: 24px;
        flex-wrap: wrap;
      }

      .mark-lg {
        width: 160px;
        height: 160px;
      }

      .mark-sm {
        width: 64px;
        height: 64px;
      }

      .dark {
        background: #211f1a;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="surface">
        <img class="lockup" src="./agent-studio-lockup.svg" alt="Agent Studio logo" />
      </section>
      <section class="surface marks">
        <img class="mark-lg" src="./agent-studio-mark.svg" alt="Agent Studio mark large" />
        <img class="mark-sm" src="./agent-studio-mark.svg" alt="Agent Studio mark small" />
      </section>
      <section class="surface dark marks">
        <img class="mark-lg" src="./agent-studio-mark.svg" alt="Agent Studio mark on dark background" />
        <img class="mark-sm" src="./agent-studio-mark.svg" alt="Agent Studio mark small on dark background" />
      </section>
    </main>
  </body>
</html>
