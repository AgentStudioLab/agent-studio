  <script>
    (() => {
      const STORAGE_KEY = 'preferred_theme_mode';
      const root = document.documentElement;
      let userPref = null;
      try { userPref = localStorage.getItem(STORAGE_KEY); } catch {}
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const applyMode = (m) => root.setAttribute('data-mode', m);
      if (userPref === 'light' || userPref === 'dark') applyMode(userPref);
      else applyMode(media.matches ? 'dark' : 'light');
      const handleChange = (ev) => {
        let stored = null;
        try { stored = localStorage.getItem(STORAGE_KEY); } catch {}
        if (stored !== 'light' && stored !== 'dark') applyMode(ev.matches ? 'dark' : 'light');
      };
      if (media.addEventListener) media.addEventListener('change', handleChange);
      else if (media.addListener) media.addListener(handleChange);
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    /* Theme hook */
    const useThemeMode = () => {
      const [mode, setModeState] = useState(() =>
        document.documentElement.getAttribute('data-mode') || 'light'
      );
      const setMode = (next) => {
        try { localStorage.setItem('preferred_theme_mode', next); } catch {}
        document.documentElement.setAttribute('data-mode', next);
        setModeState(next);
      };
      useEffect(() => {
        const media = window.matchMedia('(prefers-color-scheme: dark)');
        const handler = (e) => {
          let stored = null;
          try { stored = localStorage.getItem('preferred_theme_mode'); } catch {}
          if (stored !== 'light' && stored !== 'dark') {
            const resolved = e.matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-mode', resolved);
            setModeState(resolved);
          }
        };
        media.addEventListener('change', handler);
        return () => media.removeEventListener('change', handler);
      }, []);
      return { mode, toggle: () => setMode(mode === 'dark' ? 'light' : 'dark') };
    };

                        <div className="text-[11px] text-text-400 leading-tight mt-0.5">{m.desc}</div>
                      </div>
                      {!m.on && <span className="text-[10px] text-text-400 italic">off</span>}
                    </div>
                  ))}
                </div>
              </div>
            )}

          </div>
        </aside>
      );
    };

    /* ================= App ================= */
    const App = () => {
      const { mode, toggle } = useThemeMode();
      // 默认 active = 任务进行视图 (Identify inactive projects)
      const [view, setView] = useState('task');
      const [activeTaskId, setActiveTaskId] = useState('identify');
      const [rightOpen, setRightOpen] = useState(true);

      const taskLabels = {
        identify: 'Identify inactive projects',
        weekly: 'Weekly review',
        'new-sched': 'New scheduled task',
        'new-art': 'New live artifact',
        refactor: 'Refactor huashu-design plugins',
        briefing: 'Daily briefing',
      };

      const handleNavClick = (v) => {
        if (v === 'new-task') {
          setView('new-task');
        } else {
          setView(v);
        }
      };
      const handleTaskClick = (id) => {
        setActiveTaskId(id);
        setView('task');
      };

      return (
        <div>
          <div className="mb-4 text-center">
            <div className="font-serif text-[13px] text-text-300 mb-1">Claude Desktop · Cowork · Showcase 1 · v4</div>
            <div className="text-[11px] text-text-400 tracking-wider uppercase">
              {mode === 'dark' ? 'Dark' : 'Light'} · {view === 'new-task' ? 'New task empty state' : view === 'task' ? 'Task in progress' : view}
              <span className="mx-2">·</span>
              点 sidebar 切换状态
            </div>
          </div>

          <div className="mac-window" style={{ width: 1380 }}>
            <div className="mac-titlebar">
              <TrafficLights />
              <div className="absolute inset-x-0 text-center text-[13px] text-text-300 pointer-events-none font-medium">Claude</div>
              <div className="ml-auto flex items-center gap-1 relative z-10">
                <ThemeToggle mode={mode} onToggle={toggle} />
              </div>
            </div>

            <div className="flex" style={{ height: 860 }}>
              <AppSidebar
                activeView={view}
                activeTaskId={activeTaskId}
                onNavClick={handleNavClick}
                onTaskClick={handleTaskClick}
              />

              {view === 'new-task' && <NewTaskView />}
              {view === 'task' && (
                <TaskProgressView
                  taskTitle={taskLabels[activeTaskId] || 'Task'}
                  onToggleRight={() => setRightOpen(!rightOpen)}
                />
              )}
              {view === 'projects' && (
                <main className="flex-1 flex items-center justify-center bg-bg-100 dot-pattern">
                  <div className="text-center text-text-400">
                    <IconBriefcase size={32} className="mx-auto mb-3 opacity-50" />
                    <div className="text-[14px] ph">[Projects 列表屏 · Showcase 2 待做]</div>
                  </div>
                </main>
              )}
              {view === 'scheduled' && (
                <main className="flex-1 flex items-center justify-center bg-bg-100 dot-pattern">
                  <div className="text-center text-text-400">
                    <IconClock size={32} className="mx-auto mb-3 opacity-50" />
                    <div className="text-[14px] ph">[Scheduled 定时任务屏 · 后续可加]</div>
                  </div>
                </main>
              )}

              {view === 'task' && rightOpen && <ContextPanel />}
            </div>
          </div>

          <div className="mt-6 max-w-[1380px] mx-auto px-4 text-[12px] text-text-300 leading-relaxed">
            <div className="font-serif text-[13px] font-medium text-text-100 mb-2">📝 v4 自检</div>
            <ul className="space-y-1 list-disc pl-5 font-sans">
              <li>✅ 去掉了 ModeTabs (Chat/Cowork/Code)</li>
              <li>✅ Sidebar nav 精简 6→3 项: New task / Projects / Scheduled (移除 Live artifacts / Dispatch / Customize)</li>
              <li>✅ New task 默认状态: 居中衬线大标题 "Let's knock something off your list" + 橙色 8 角星 + 输入框 (Image #5)</li>
              <li>✅ 输入框 (Image #6): + / Work in a project ⌄ / Ask ⌄ / Legacy Model ⌄ / 麦克风 / 橙色发送按钮 (任务进行时) / Disclaimer</li>
              <li>✅ 任务进行视图 (Image #7): 顶部 task 标题 ⌄ + sidebar toggle / 对话流 + 预设问答衬线卡片 + Ran 2 commands 折叠 / Artifact 内嵌卡片 (wpsoffice ⌄) / 反馈按钮 / 加载橙星</li>
              <li>✅ 右侧 Context Panel: Files | Context 两 tab segment 切换 (按 Image #9 风格 — active widen+label / inactive icon-only). 移除 Progress.</li>
              <li>　　· <strong>Files</strong>: stuio 项目工作树 (CLAUDE.md / 项目清理报告.xlsx · new / inactive-projects.md / summary.pptx) + "Add files to working tree" 拖入区</li>
              <li>　　· <strong>Context</strong>: Skills (xlsx/pptx/huashu-design + 中文描述) + MCP servers (filesystem on / github on / slack off + 中文描述)</li>
              <li>✅ <strong>状态切换</strong>: 点 sidebar "+ New task" 切到 empty state (右栏隐藏); 点 Recents 任一 task 切回任务进行视图</li>
              <li>⏳ 待做: Showcase 2 (Projects 列表屏) + tokens.css 交付包</li>
            </ul>
            <div className="mt-3 px-3 py-2 rounded font-sans" style={{ background: 'hsl(var(--brand-100) / 0.10)', color: 'hsl(var(--brand-100))' }}>
              <strong>🛑 等你 review:</strong>
              <ol className="mt-1 ml-4 list-decimal space-y-0.5">
                <li>New task 状态 + 任务进行视图 切换准吗?</li>
                <li>右侧 Context 三段: Progress / [项目名] / Context (Skills+MCP) — 这个分块对吗?</li>
                <li>Skill chip 用首字母方块 (X / P / H) 标识 — 还是想用真实 lucide icon?</li>
                <li>MCP servers 显示连接状态 (绿点 = on, 灰点 = off) — 这个粒度够吗?</li>
                <li>下一步: (a) Showcase 2 Projects 列表屏 → (b) tokens.css 交付包 → (c) 加 Scheduled / Live artifacts 屏</li>
              </ol>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
