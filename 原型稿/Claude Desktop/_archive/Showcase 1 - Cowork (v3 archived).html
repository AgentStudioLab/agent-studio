    =================================================================
    Showcase 1 · Cowork · v3 · 任务驱动视图(基于 Claude Cowork 真实产品)
    =================================================================

    🎯 v2 → v3 关键转向
    v2 走的是"ChatGPT-like 对话客户端"。
    v3 按 Claude Cowork 真实产品(2026-04-09 GA)的概念重写——这是个
    任务驱动的 agentic 工作台,不是聊天 App。

    📚 Cowork 五个核心 mode (来自 Anthropic 官方)
      1. New task        启动一个 agentic 任务,spin up subagents、
                         读写本地文件、调 MCP servers
      2. Projects        任务容器,带 files / instructions / memory,
                         跨任务持久 (Cowork 自己的 memory 仅在 project 里)
      3. Scheduled       定时任务 (每日简报、每周报告) — 需要电脑保持唤醒
      4. Live artifacts  持久 HTML dashboard, 自动 refresh 当前数据,
                         有版本历史。这是 Cowork 的视觉签名功能
      5. Dispatch (Beta) 手机远程触发 desktop cowork session

    🏗 信息架构变化
      v2: Sidebar = Workspace + 新建对话 + Search + 最近对话 + 项目 + Cowork + MCP/Settings
      v3: Sidebar = Top tabs(Chat|Cowork|Code) + New task + Projects + Scheduled
                  + Live artifacts + Dispatch[Beta] + Customize
                  + Recents 任务列表 + Update 卡片 + User 底部

      v2: 主视图 = Chat 对话气泡 + 输入区
      v3: 主视图 = Task 执行视图 (Plan checklist + Tool timeline +
                                 Live output + 调整 task 的输入区)

    🎨 设计系统(沿用 v2 的 Anthropic Design Tokens + light/dark)
      HSL 三元组 + hsl() 包裹 / data-theme × data-mode 双轴主题
      字体: Inter / Source Serif 4 / JetBrains Mono

    📦 shadcn 命名 (开发同学请遵守)
      ModeTabs (Chat/Cowork/Code)   → 对应 Tabs primitive
      NavSection / NavItem           → Sidebar primitive 的 item
      RecentItem                     → Sidebar 的 sub-item with status dot
      UpdateCard                     → Card variant 内置 cta
      UserBar                        → 底部用户档案区
      TaskHeader                     → Card header
      TaskPlan / PlanStep            → Checklist (自定义)
      ToolCall                       → Collapsible
      LiveOutput                     → Card with monospace table
      TaskInput                      → Textarea + Button
      ContextPanel / Tabs            → Tabs + ScrollArea
  -->

  <script>
    (() => {
      const STORAGE_KEY = 'preferred_theme_mode';
      const root = document.documentElement;
      let userPref = null;
      try { userPref = localStorage.getItem(STORAGE_KEY); } catch {}
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const applyMode = (m) => root.setAttribute('data-mode', m);
      if (userPref === 'light' || userPref === 'dark') applyMode(userPref);
      else applyMode(media.matches ? 'dark' : 'light');
      const handleChange = (ev) => {
        let stored = null;
        try { stored = localStorage.getItem(STORAGE_KEY); } catch {}
        if (stored !== 'light' && stored !== 'dark') applyMode(ev.matches ? 'dark' : 'light');
      };
      if (media.addEventListener) media.addEventListener('change', handleChange);
      else if (media.addListener) media.addListener(handleChange);
    })();
  </script>

    const useThemeMode = () => {
      const [mode, setModeState] = useState(() =>
        document.documentElement.getAttribute('data-mode') || 'light'
      );
      const setMode = (next) => {
        try { localStorage.setItem('preferred_theme_mode', next); } catch {}
        document.documentElement.setAttribute('data-mode', next);
        setModeState(next);
      };
      useEffect(() => {
        const media = window.matchMedia('(prefers-color-scheme: dark)');
        const handler = (e) => {
          let stored = null;
          try { stored = localStorage.getItem('preferred_theme_mode'); } catch {}
          if (stored !== 'light' && stored !== 'dark') {
            const resolved = e.matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-mode', resolved);
            setModeState(resolved);
          }
        };
        media.addEventListener('change', handler);
        return () => media.removeEventListener('change', handler);
      }, []);
      return { mode, toggle: () => setMode(mode === 'dark' ? 'light' : 'dark') };
    };

                    (tab === t.id ? 'bg-bg-000 text-text-100 shadow-sm' : 'text-text-300 hover:text-text-100')
                  }
                >
                  {t.label}
                </button>
              ))}
            </div>
          </div>

          <div className="flex-1 overflow-y-auto">
            {tab === 'files' && (
              <div className="p-4 space-y-3">
                <div className="text-[11px] tracking-wider uppercase text-text-400">This task touched</div>
                {[
                  { path: '~/Workspace/', kind: 'dir', read: true, write: false },
                  { path: '~/Workspace/*/.git/logs', kind: 'dir', read: true, write: false },
                  { path: '~/Desktop/inactive-projects.md', kind: 'file', read: false, write: true, status: 'pending' },
                ].map((f, i) => (
                  <div key={i} className="flex items-center gap-2.5 px-2 py-2 rounded-md hover:bg-bg-200 transition">
                    <span className="text-text-400 shrink-0">
                      {f.kind === 'dir' ? <IconFolder size={14} /> : <IconFile size={14} />}
                    </span>
                    <div className="flex-1 min-w-0">
                      <div className="font-mono text-[12px] text-text-100 truncate">{f.path}</div>
                      <div className="flex items-center gap-1.5 mt-0.5">
                        {f.read && <span className="text-[10px] px-1.5 py-px rounded bg-accent-100/15 text-accent-100">read</span>}
                        {f.write && <span className="text-[10px] px-1.5 py-px rounded" style={{ background: 'hsl(var(--brand-100) / 0.15)', color: 'hsl(var(--brand-100))' }}>write</span>}
                        {f.status === 'pending' && <span className="text-[10px] text-text-400 italic">pending</span>}
                      </div>
                    </div>
                  </div>
                ))}

                <div className="pt-3 mt-3" style={{ borderTop: '1px solid hsl(var(--border-300) / 0.12)' }}>
                  <div className="text-[11px] tracking-wider uppercase text-text-400 mb-2">MCP tools used</div>
                  <div className="flex flex-wrap gap-1.5">
                    {['bash', 'glob', 'read', 'write'].map((t) => (
                      <span key={t} className="px-2 py-0.5 rounded font-mono text-[11px] bg-bg-200 text-text-200">{t}</span>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {tab === 'artifact' && (
              <div className="p-4 space-y-3">
                <div className="text-[11px] tracking-wider uppercase text-text-400">If saved, will appear in</div>
                <div className="flex items-center gap-2 text-[12.5px] text-text-200">
                  <IconLeaf size={14} className="text-success-100" />
                  <span>Live artifacts</span>
                </div>
                <div className="rounded-lg p-4 mt-2" style={{ background: 'hsl(var(--success-100) / 0.05)', border: '1px dashed hsl(var(--success-100) / 0.3)' }}>
                  <div className="font-serif text-[14px] text-text-100 mb-1 ph">[未保存 · 点 "Save as live artifact" 把当前 task 的输出固化成 dashboard]</div>
                  <div className="text-[11.5px] text-text-400 leading-relaxed">
                    Live artifact 会自动重新跑这个任务, refresh 最新数据。每周/每天打开就是当前状态, 不用重新提问。
                  </div>
                </div>
              </div>
            )}

            {tab === 'history' && (
              <div className="p-4 space-y-2">
                <div className="text-[11px] tracking-wider uppercase text-text-400 mb-3">Previous runs</div>
                {[
                  { when: '今天 14:23', dur: '02:13', status: 'running' },
                  { when: '昨天 09:15', dur: '01:48', status: 'done' },
                  { when: '2 天前 09:15', dur: '02:01', status: 'done' },
                  { when: '3 天前 09:15', dur: '01:55', status: 'done' },
                  { when: '4 天前 09:15', dur: '02:08', status: 'done' },
                ].map((r, i) => (
                  <div key={i} className="flex items-center gap-3 p-2 rounded-md hover:bg-bg-200 transition">
                    <span className={'w-1.5 h-1.5 rounded-full ' + (r.status === 'running' ? 'bg-success-100 pulse-dot' : 'bg-text-400/50')}></span>
                    <span className="flex-1 text-[13px] text-text-200">{r.when}</span>
                    <span className="text-[11px] text-text-400 font-mono">{r.dur}</span>
                  </div>
                ))}
                <div className="pt-3 mt-3 text-[11.5px] text-text-400 italic" style={{ borderTop: '1px solid hsl(var(--border-300) / 0.12)' }}>
                  这个 task 由 Scheduled (daily 09:00) 触发, 已运行 5 次。
                </div>
              </div>
            )}
          </div>
        </aside>
      );
    };

    /* ============================================================
       App composition
       ============================================================ */
    const App = () => {
      const [rightOpen, setRightOpen] = useState(true);
      const { mode, toggle } = useThemeMode();

      return (
        <div>
          <div className="mb-4 text-center">
            <div className="font-serif text-[13px] text-text-300 mb-1">Claude Desktop · Cowork · Showcase 1 · v3</div>
            <div className="text-[11px] text-text-400 tracking-wider uppercase">
              Task-driven view · {mode === 'dark' ? 'Dark' : 'Light'} · 按 Anthropic Cowork 真实 IA
            </div>
          </div>

          <div className="mac-window" style={{ width: 1320 }}>
            <div className="mac-titlebar">
              <TrafficLights />
              <div className="absolute inset-x-0 text-center text-[13px] text-text-300 pointer-events-none font-medium">
                Claude
              </div>
              <div className="ml-auto flex items-center gap-1 relative z-10">
                <ThemeToggle mode={mode} onToggle={toggle} />
              </div>
            </div>

            <div className="flex" style={{ height: 820 }}>
              <AppSidebar />
              <TaskMain />
              {rightOpen && <ContextPanel onClose={() => setRightOpen(false)} />}
            </div>
          </div>

          {/* Self-check footnote */}
          <div className="mt-6 max-w-[1320px] mx-auto px-4 text-[12px] text-text-300 leading-relaxed">
            <div className="font-serif text-[13px] font-medium text-text-100 mb-2">📝 v3 自检 (基于 Claude Cowork 真实产品)</div>
            <ul className="space-y-1 list-disc pl-5 font-sans">
              <li>✅ 顶部三栏 segment control: <code className="inline">Chat / Cowork / Code</code> (active 状态 Cowork 显示文字)</li>
              <li>✅ 主 nav 6 项: New task / Projects / Scheduled / Live artifacts / Dispatch[Beta] / Customize</li>
              <li>✅ Recents 列表 (running 状态有 pulse 动画, 区分 done / idle)</li>
              <li>✅ 底部 Update 卡片 + UserBar (JY · Jay Yang · Max + 下载 icon)</li>
              <li>✅ 主视图 = Task 执行视图: Header (面包屑 + 状态 + 操作) + Brief + Plan checklist + Live output 数据表 + 调整任务输入区</li>
              <li>✅ Plan checklist 三态: ✓ done (灰删除线) · ▶ active (橙脉冲) · ○ pending</li>
              <li>✅ Live output 区有真实 tool call (bash) + 表格流式数据 + "scanning..." 进度</li>
              <li>✅ 右侧 Context Panel: Files (read/write 标签 + MCP tools 列表) / Live artifact (未保存提示) / History (cron 运行历史)</li>
              <li>✅ Anthropic 设计系统 + light/dark 双轴 (右上角切换)</li>
              <li>⏳ 待填 (Full pass): 真实 task 标题 / 真实 brief / 更多 Recents 任务</li>
            </ul>
            <div className="mt-3 px-3 py-2 rounded font-sans" style={{ background: 'hsl(var(--brand-100) / 0.10)', color: 'hsl(var(--brand-100))' }}>
              <strong>🛑 等你 review:</strong>
              <ol className="mt-1 ml-4 list-decimal space-y-0.5">
                <li>这个"任务驱动 = 主视图是 Task 执行而非 Chat" 方向对吗?</li>
                <li>Plan checklist + Live output 表格 的组合, 还是你想看更激进的可视化(timeline / Gantt / 图)?</li>
                <li>Cowork tab active 时三栏 segment 控件让 Cowork 变宽(显示文字), 其他两个保留 icon 收缩。OK 吗 / 还是三个都同宽?</li>
                <li>右侧 Files 区列出 read/write 文件 + MCP tools 标签, 这个粒度对开发同学有用吗?</li>
                <li>下一步: (a) Full pass 填实 → (b) Showcase 2 Project 详情屏 → (c) 抽 tokens.css 交付包。怎么排?</li>
              </ol>
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
