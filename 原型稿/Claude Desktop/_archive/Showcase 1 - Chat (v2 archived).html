    🔧 关键约定 (开发同学请遵守)
      1. 颜色 token 是 HSL 三元组裸值, 使用必须包 hsl():
           ❌ color: var(--brand-100)             ← 会失效
           ✅ color: hsl(var(--brand-100))
           ✅ color: hsl(var(--brand-100) / 0.3)  ← 派生 alpha
      2. Tailwind utility 已注册:
           bg-bg-100  text-text-200  border-border-300
           bg-brand-100  text-accent-000  ...
         直接用 utility 比裸 hsl() 更短
      3. dark 模式切换不需要 dark: variant — 因为 token 自动随
         [data-mode] 切换值, utility class 引用的 hsl(var(--xxx)) 自动跟随
      4. 字体三家族:

  <script>
    (() => {
      const STORAGE_KEY = 'preferred_theme_mode';
      const root = document.documentElement;
      let userPref = null;
      try { userPref = localStorage.getItem(STORAGE_KEY); } catch {}
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const applyMode = (m) => root.setAttribute('data-mode', m);
      if (userPref === 'light' || userPref === 'dark') {
        applyMode(userPref);
      } else {
        applyMode(media.matches ? 'dark' : 'light');
      }
      const handleChange = (ev) => {
        let stored = null;
        try { stored = localStorage.getItem(STORAGE_KEY); } catch {}
        if (stored !== 'light' && stored !== 'dark') {
          applyMode(ev.matches ? 'dark' : 'light');
        }
      };
      if (media.addEventListener) media.addEventListener('change', handleChange);
      else if (media.addListener) media.addListener(handleChange);
    })();
  </script>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect } = React;

    /* ============================================================
       Theme hook · 切 data-mode + 持久化
       ============================================================ */
    const useThemeMode = () => {
      const [mode, setModeState] = useState(() =>
        document.documentElement.getAttribute('data-mode') || 'light'
      );

      const setMode = (next) => {
        if (next === 'system') {
          try { localStorage.removeItem('preferred_theme_mode'); } catch {}
          const media = window.matchMedia('(prefers-color-scheme: dark)');
          const resolved = media.matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-mode', resolved);
          setModeState(resolved);
          return;
        }
        try { localStorage.setItem('preferred_theme_mode', next); } catch {}
        document.documentElement.setAttribute('data-mode', next);
        setModeState(next);
      };

      useEffect(() => {
        const media = window.matchMedia('(prefers-color-scheme: dark)');
        const handler = (e) => {
          let stored = null;
          try { stored = localStorage.getItem('preferred_theme_mode'); } catch {}
          if (stored !== 'light' && stored !== 'dark') {
            const resolved = e.matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-mode', resolved);
            setModeState(resolved);
          }
        };
        media.addEventListener('change', handler);
        return () => media.removeEventListener('change', handler);
      }, []);

      return { mode, setMode, toggle: () => setMode(mode === 'dark' ? 'light' : 'dark') };
    };
