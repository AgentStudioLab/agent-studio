  <script>
    (() => {
      const STORAGE_KEY = 'preferred_theme_mode';
      const root = document.documentElement;
      let userPref = null;
      try { userPref = localStorage.getItem(STORAGE_KEY); } catch {}
      const media = window.matchMedia('(prefers-color-scheme: dark)');
      const applyMode = (m) => root.setAttribute('data-mode', m);
      if (userPref === 'light' || userPref === 'dark') applyMode(userPref);
      else applyMode(media.matches ? 'dark' : 'light');
      const handleChange = (ev) => {
        let stored = null;
        try { stored = localStorage.getItem(STORAGE_KEY); } catch {}
        if (stored !== 'light' && stored !== 'dark') applyMode(ev.matches ? 'dark' : 'light');
      };
      if (media.addEventListener) media.addEventListener('change', handleChange);
      else if (media.addListener) media.addListener(handleChange);
    })();
  </script>

    const { useState, useEffect, useRef } = React;

    /* ===== Theme hook (含 pref: system|light|dark) ===== */
    const useThemeMode = () => {
      const STORAGE_KEY = 'preferred_theme_mode';
      const [mode, setModeState] = useState(() => document.documentElement.getAttribute('data-mode') || 'light');
      const [pref, setPrefState] = useState(() => {
        try { return localStorage.getItem(STORAGE_KEY) || 'system'; } catch { return 'system'; }
      });
      const applyPref = (p) => {
        if (p === 'system') {
          try { localStorage.removeItem(STORAGE_KEY); } catch {}
          const m = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.setAttribute('data-mode', m);
          setModeState(m);
        } else {
          try { localStorage.setItem(STORAGE_KEY, p); } catch {}
          document.documentElement.setAttribute('data-mode', p);
          setModeState(p);
        }
        setPrefState(p);
      };
      useEffect(() => {
        const media = window.matchMedia('(prefers-color-scheme: dark)');
        const handler = (e) => {
          let stored = null;
          try { stored = localStorage.getItem(STORAGE_KEY); } catch {}
          if (stored !== 'light' && stored !== 'dark') {
            const resolved = e.matches ? 'dark' : 'light';
            document.documentElement.setAttribute('data-mode', resolved);
            setModeState(resolved);
          }
        };
        media.addEventListener('change', handler);
        return () => media.removeEventListener('change', handler);
      }, []);
      return { mode, pref, setPref: applyPref };
    };

          </div>

            <div className="tracking-[0.25em] mb-1" style={{ color: '#3CDCAB' }}>不 活 跃 阈 值</div>
            <div style={{ color: 'white' }}>90 天无文件修改</div>
          </div>
          <div>
            <div className="tracking-[0.25em] mb-1" style={{ color: '#3CDCAB' }}>生 成 日 期</div>
            <div style={{ color: 'white' }}>2026 年 05 月 15 日</div>
          </div>
        </div>
        <div className="absolute bottom-3 left-7 right-7 flex items-baseline justify-between text-[7px]" style={{ color: 'rgba(255,255,255,0.4)' }}>
          <span className="font-mono tracking-[0.25em]">P R O J E C T &nbsp; C L E A N U P &nbsp; R E P O R T &nbsp; · &nbsp; 2 0 2 6 . 0 5 . 1 5</span>
          <span className="font-mono">01 / 07</span>
        </div>
      </div>
    );

    const PPTSummarySlide = () => (
      <div className="rounded-md p-7 relative" style={{ background: '#0A0E1A', aspectRatio: '16 / 10', minHeight: 280 }}>
        <div className="flex items-center gap-3 mb-1 text-[8.5px] tracking-[0.3em]" style={{ color: '#3CDCAB' }}>
          <span style={{ borderLeft: '2px solid #3CDCAB', paddingLeft: 5 }}>0 1</span>
          <span style={{ opacity: 0.7 }}>·</span>
          <span>E X E C U T I V E &nbsp; S U M M A R Y</span>
        </div>
        <h2 className="text-[18px] font-bold mb-5 leading-none" style={{ color: 'white' }}>执行摘要</h2>
        <div className="grid grid-cols-4 gap-2 mb-5">
          {[
            { label: '项 目 总 数',    value: '19',  sub: '扫描覆盖',          color: '#3CDCAB' },
            { label: '不 活 跃 项 目', value: '7',   sub: '≥ 90 天未更新',     color: '#FFB347' },
            { label: '已 清 理 目 录', value: '17',  sub: 'node_modules / .next', color: '#5B8DF0' },
            { label: 'GB 释 放 空 间', value: '4.3', sub: '可重建恢复',         color: '#B47BFF' },
          ].map((c, i) => (
            <div key={i} className="px-2 pt-2 pb-1.5" style={{ borderTop: `1.5px solid ${c.color}`, background: 'rgba(255,255,255,0.02)' }}>
              <div className="text-[6.5px] tracking-[0.2em] mb-1" style={{ color: 'rgba(255,255,255,0.55)' }}>{c.label}</div>
              <div className="text-[20px] font-bold leading-none mb-0.5" style={{ color: c.color }}>{c.value}</div>
              <div className="text-[7px]" style={{ color: 'rgba(255,255,255,0.5)' }}>{c.sub}</div>
            </div>
          ))}
        </div>
        <div className="text-[8.5px] tracking-[0.25em] mb-2" style={{ color: '#3CDCAB' }}>关 键 发 现</div>
        <div className="grid grid-cols-3 gap-2">
          {[
            { text: 'mcp-servers / xeno 闲置超 8 个月', sub: '最久未活动项目' },
            { text: 'agent-ui-projects 释放 2.4 GB',   sub: '占总清理量 55%' },
            { text: '所有内容均可一键恢复',              sub: '零数据丢失风险' },
          ].map((f, i) => (
            <div key={i} className="px-2 py-1.5" style={{ background: 'rgba(255,255,255,0.03)', borderLeft: '1.5px solid #3CDCAB' }}>
              <div className="text-[8.5px] font-medium leading-snug" style={{ color: 'white' }}>{f.text}</div>
              <div className="text-[7px] mt-0.5" style={{ color: 'rgba(255,255,255,0.5)' }}>{f.sub}</div>
            </div>
          ))}
        </div>
        <div className="absolute bottom-3 left-7 right-7 flex items-baseline justify-between text-[7px]" style={{ color: 'rgba(255,255,255,0.4)' }}>
          <span className="font-mono tracking-[0.25em]">P R O J E C T &nbsp; C L E A N U P &nbsp; R E P O R T &nbsp; · &nbsp; 2 0 2 6 . 0 5 . 1 5</span>
          <span className="font-mono">02 / 07</span>
        </div>
      </div>
    );

    const MDPreview = ({ filename }) => (
      <div className="rounded-md p-6 font-mono text-[12.5px] leading-relaxed" style={{ background: 'hsl(var(--bg-200) / 0.6)', border: '1px solid hsl(var(--border-300) / 0.08)' }}>
        <div className="text-text-100 mb-4 text-[15px] font-serif"># {filename.replace('.md', '')}</div>
        <p className="text-text-300 mb-3">本任务对本地工作目录 <code className="inline">~/Workspace</code> 进行不活跃度扫描, 找出 ≥ 30 天没有 git commit 的项目。</p>
        <p className="text-text-300 mb-3">## 扫描配置</p>
        <p className="text-text-400">- 扫描路径: <span className="text-text-200">~/Workspace</span></p>
        <p className="text-text-400">- 不活跃阈值: <span className="text-text-200">30 days</span></p>
        <p className="text-text-400">- 沉睡阈值: <span className="text-text-200">90 days</span></p>
        <p className="text-text-300 mb-3 mt-4">## 结果摘要</p>
        <p className="text-text-300">共扫描 <span className="text-text-100 font-bold">14</span> 个项目, 标记 <span className="text-text-100 font-bold">7</span> 个不活跃。</p>
      </div>
    );

    const XlsxPreview = () => (
      <div className="rounded-md overflow-hidden font-mono text-[11.5px]" style={{ background: 'hsl(var(--bg-200) / 0.5)', border: '1px solid hsl(var(--border-300) / 0.1)' }}>
        <div className="grid grid-cols-4 text-text-300 text-[10px] tracking-wider uppercase" style={{ background: 'hsl(125 40% 50% / 0.15)' }}>
          <div className="px-3 py-2">Project</div>
          <div className="px-3 py-2">Last commit</div>
          <div className="px-3 py-2">Days idle</div>
          <div className="px-3 py-2">Status</div>
        </div>
        {[
          { p: 'huashu-design', d: '2025-05-13', i: 2, s: 'active', sc: '#3CDCAB' },
          { p: 'ugreen-ai', d: '2025-05-15', i: 0, s: 'active', sc: '#3CDCAB' },
          { p: 'stuio', d: '2025-05-15', i: 0, s: 'active', sc: '#3CDCAB' },
          { p: 'blog-posts-q2', d: '2025-03-29', i: 47, s: 'inactive', sc: '#FFB347' },
          { p: 'design-tokens-lib', d: '2025-03-14', i: 62, s: 'inactive', sc: '#FFB347' },
          { p: 'side-project-cron', d: '2024-12-10', i: 156, s: 'dormant', sc: '#FF6B6B' },
        ].map((row, i) => (
          <div key={i} className="grid grid-cols-4" style={{ borderTop: '1px solid hsl(var(--border-300) / 0.08)' }}>
            <div className="px-3 py-2 text-text-100">{row.p}</div>
            <div className="px-3 py-2 text-text-300">{row.d}</div>
            <div className="px-3 py-2 text-text-200 font-bold">{row.i}</div>
            <div className="px-3 py-2"><span className="px-2 py-0.5 rounded" style={{ background: row.sc + '26', color: row.sc }}>{row.s}</span></div>
          </div>
        ))}
      </div>
    );

    const PreviewPane = ({ file, onClose }) => {
      const [width, setWidth] = useState(520);
      const [dragging, setDragging] = useState(false);
      const MIN_W = 360, MAX_W = 720;

      useEffect(() => {
        if (!dragging) return;
        const onMove = (e) => {
          const w = window.innerWidth - e.clientX - 32;
          const clamped = Math.max(MIN_W, Math.min(MAX_W, w));
          setWidth(clamped);
        };
        const onUp = () => setDragging(false);
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        return () => {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          document.body.style.cursor = '';
          document.body.style.userSelect = '';
        };
      }, [dragging]);

      const ext = file.type;
      const isPPT = ext === 'pptx';
      const isXLSX = ext === 'xlsx';
      const isMD = ext === 'md';
      const fileLabel =
        isPPT ? 'PPTX' : isXLSX ? 'XLSX' : isMD ? 'Markdown' : ext.toUpperCase();
      const baseName = file.name.replace(/\.(pptx|xlsx|md)$/, '').replace(/^Instructions · /, '');
      const openerName = isPPT ? 'wpsoffice' : isXLSX ? 'wpsoffice' : 'VS Code';
      const openerColor = isMD ? 'hsl(210 100% 55%)' : 'hsl(15 75% 55%)';
      const openerLetter = isMD ? 'C' : 'W';

      return (
        <aside className="relative shrink-0 flex flex-col bg-bg-100 slide-in-right"
          style={{ width, borderLeft: '1px solid hsl(var(--border-300) / 0.12)' }}>
          <div
            className={'resize-handle ' + (dragging ? 'resize-handle-active' : '')}
            onMouseDown={(e) => { e.preventDefault(); setDragging(true); }}
          />
          <header className="h-12 px-4 flex items-center gap-3 shrink-0" style={{ borderBottom: '1px solid hsl(var(--border-300) / 0.1)' }}>
            <div className="flex-1 min-w-0">
              <span className="text-[13.5px] text-text-100 font-medium truncate">{baseName}</span>
              <span className="text-text-400 mx-2 text-[12px]">·</span>
              <span className="text-[12px] text-text-300">{fileLabel}</span>
            </div>
            <button className="flex items-center gap-1.5 px-2.5 py-1 rounded-md text-[12px] text-text-200 hover:text-text-100 hover:bg-bg-200 transition" style={{ border: '1px solid hsl(var(--border-300) / 0.15)' }}>
              <span className="w-3.5 h-3.5 rounded-sm flex items-center justify-center text-[8.5px] font-bold text-oncolor-100" style={{ background: openerColor }}>{openerLetter}</span>
              {openerName}
              <IconChevron size={11} />
            </button>
            <button className="p-1.5 rounded-md hover:bg-bg-200 text-text-300 hover:text-text-100 transition" title="刷新">
              <IconRefresh size={13} />
            </button>
            <button onClick={onClose} className="p-1.5 rounded-md hover:bg-bg-200 text-text-300 hover:text-text-100 transition" title="关闭">
              <IconX size={14} />
            </button>
          </header>

          <div className="flex-1 overflow-y-auto p-3 space-y-3">
            {isPPT && (<><PPTCoverSlide /><PPTSummarySlide /></>)}
            {isXLSX && <XlsxPreview />}
            {isMD && <MDPreview filename={baseName} />}
            {!isPPT && !isXLSX && !isMD && (
              <div className="text-[13px] text-text-400 italic px-4 py-8 text-center">
                [Preview for .{ext} not implemented in this mock]
              </div>
            )}
          </div>
        </aside>
      );
    };

    /* ============================================================
       App composition
       ============================================================ */
    const App = () => {
      const { mode, pref, setPref } = useThemeMode();
      const [view, setView] = useState('project-detail');
      const [prevView, setPrevView] = useState('project-detail');
      const [activeTaskId, setActiveTaskId] = useState(null);
      const [activeProjectId, setActiveProjectId] = useState('jay');
      const [activeScheduled, setActiveScheduled] = useState(null);
      const [rightOpen, setRightOpen] = useState(true);
      const [previewFile, setPreviewFile] = useState(null);

      const taskLabels = {
        identify: 'Identify inactive projects',
        weekly: 'Weekly review',
        newsched: 'New scheduled task',
        newart: 'New live artifact',
        casual: 'Casual conversation',
        greeting: 'Chinese greeting conversation',
        briefing: 'Daily briefing',
      };
      const projectLabels = {
        jay: 'jay', huashu: 'huashu-design', ugreen: 'ugreen-ai 原型稿',
        stuio: 'stuio', skills: 'claude-skills-pack',
      };

      const goTo = (v) => { if (view !== 'settings') setPrevView(view); setView(v); };
      const handleNavClick = (v) => goTo(v);
      const handleTaskClick = (id) => { setActiveTaskId(id); goTo('task'); };
      const handleProjectClick = (id) => { setActiveProjectId(id); goTo('project-detail'); };
      const handleSettingsClick = () => { setPrevView(view); setView('settings'); };
      const handleBackFromSettings = () => setView(prevView || 'project-detail');

      const inSettings = view === 'settings';
      const inCustomize = view === 'customize';
      const inFullscreen = inSettings || inCustomize;

      return (
        <div>
          <div className="mac-window" style={{ width: 1480 }}>
            <div className="mac-titlebar">
              <TrafficLights />
              {!inFullscreen && (
                <div className="absolute inset-x-0 text-center text-[13px] text-text-300 pointer-events-none font-medium">Agent Studio</div>
              )}
            </div>

            <div className="flex" style={{ height: 880 }}>
              {!inFullscreen && (
                <AppSidebar
                  view={view}
                  activeTaskId={activeTaskId}
                  activeProjectId={activeProjectId}
                  onNavClick={handleNavClick}
                  onTaskClick={handleTaskClick}
                  onProjectClick={handleProjectClick}
                  onSettingsClick={handleSettingsClick}
                />
              )}

              {view === 'new-task' && <NewTaskView />}
              {view === 'task' && (
                <TaskProgressView taskTitle={taskLabels[activeTaskId] || 'Task'} onToggleRight={() => setRightOpen(!rightOpen)} />
              )}
              {view === 'projects-list' && (
                <ProjectsListView onProjectClick={handleProjectClick} onNewProject={() => alert('TODO: New project')} />
              )}
              {view === 'project-detail' && (
                <ProjectDetailView projectName={projectLabels[activeProjectId]} />
              )}
              {view === 'scheduled' && (
                <ScheduledView
                  onTaskClick={handleTaskClick}
                  onOpenTask={(t) => { setActiveScheduled(t); setPrevView('scheduled'); setView('scheduled-detail'); }}
                />
              )}
              {view === 'scheduled-detail' && (
                <ScheduledDetailView
                  task={activeScheduled}
                  onBack={() => setView('scheduled')}
                />
              )}
              {view === 'customize' && (
                <CustomizeView onBack={() => setView(prevView || 'project-detail')} />
              )}
              {view === 'settings' && (
                <SettingsView onBack={handleBackFromSettings} pref={pref} setPref={setPref} />
              )}

              {view === 'task' && rightOpen && !previewFile && (
                <TaskContextPanel onPreviewFile={setPreviewFile} />
              )}
              {view === 'task' && previewFile && (
                <PreviewPane key={previewFile.name} file={previewFile} onClose={() => setPreviewFile(null)} />
              )}
              {view === 'project-detail' && rightOpen && <ProjectRightPanel />}
            </div>
          </div>
        </div>
      );
    };

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
